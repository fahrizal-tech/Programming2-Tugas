<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - TaskSphere</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container" style="display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 90vh;">
        <!-- Logo/Brand -->
        <div style="text-align: center; margin-bottom: 2rem;">
            <h1 style="font-size: 2.5rem; font-weight: 800; background: linear-gradient(135deg, #a5b4fc, #6366f1, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">TaskSphere</h1>
            <p style="color: var(--text-secondary); margin-top: 0.25rem;">Sistem Manajemen Tugas Kuliah &amp; Praktikum</p>
        </div>

        <!-- Login Card -->
        <div class="card" style="width: 100%; max-width: 420px; padding: 2.5rem;">
            <h2 class="card-title" style="text-align: center; border-bottom: none; margin-bottom: 1.5rem; padding-bottom: 0;">Selamat Datang Kembali</h2>
            
            <!-- Success/Error Alerts -->
            <div th:if="${param.error}" style="background-color: var(--danger-bg); border: 1px solid rgba(239, 68, 68, 0.2); color: #fca5a5; padding: 0.75rem 1rem; border-radius: var(--radius-md); margin-bottom: 1.5rem; font-size: 0.85rem; display: flex; align-items: center; gap: 0.5rem;">
                <i data-lucide="alert-circle" style="width: 16px; height: 16px; flex-shrink: 0;"></i>
                <span>Username atau password salah!</span>
            </div>
            
            <div th:if="${param.logout}" style="background-color: var(--info-bg); border: 1px solid rgba(14, 165, 233, 0.2); color: #38bdf8; padding: 0.75rem 1rem; border-radius: var(--radius-md); margin-bottom: 1.5rem; font-size: 0.85rem; display: flex; align-items: center; gap: 0.5rem;">
                <i data-lucide="info" style="width: 16px; height: 16px; flex-shrink: 0;"></i>
                <span>Anda telah berhasil keluar (logout).</span>
            </div>

            <div th:if="${param.registered}" style="background-color: var(--success-bg); border: 1px solid rgba(16, 185, 129, 0.2); color: #34d399; padding: 0.75rem 1rem; border-radius: var(--radius-md); margin-bottom: 1.5rem; font-size: 0.85rem; display: flex; align-items: center; gap: 0.5rem;">
                <i data-lucide="check-circle-2" style="width: 16px; height: 16px; flex-shrink: 0;"></i>
                <span>Pendaftaran berhasil! Silakan masuk.</span>
            </div>
            
            <form th:action="@{/login}" method="POST">
                <!-- Username -->
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <div style="position: relative;">
                        <input type="text" id="username" name="username" class="form-control" style="padding-left: 2.5rem;" placeholder="Masukkan username" required autofocus>
                        <i data-lucide="user" style="position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-muted);"></i>
                    </div>
                </div>
                
                <!-- Password -->
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div style="position: relative;">
                        <input type="password" id="password" name="password" class="form-control" style="padding-left: 2.5rem;" placeholder="Masukkan password" required>
                        <i data-lucide="lock" style="position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-muted);"></i>
                    </div>
                </div>
                
                <!-- Submit -->
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.85rem;">
                    <i data-lucide="log-in"></i>
                    <span>Masuk</span>
                </button>
            </form>
            
            <!-- Register Link -->
            <div style="text-align: center; margin-top: 1.75rem; font-size: 0.875rem; color: var(--text-secondary);">
                Belum punya akun? 
                <a th:href="@{/register}" style="color: var(--primary); text-decoration: none; font-weight: 600; transition: var(--transition);">Daftar di sini</a>
            </div>
        </div>
        
        <!-- Footer -->
        <footer style="width: 100%;">
            <p>&copy; 2026 Muhamad Fahrizal - Pemrograman 2. Sistem Autentikasi Aman.</p>
        </footer>
    </div>

    <!-- Lucide Icons Library -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
