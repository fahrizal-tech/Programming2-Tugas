<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Tugas - TaskSphere</title>
    <!-- Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="brand-section">
                <h1>TaskSphere</h1>
                <div class="brand-subtitle">Sistem Manajemen Tugas Kuliah &amp; Praktikum</div>
            </div>
            
            <div style="display: flex; align-items: center; gap: 1rem;">
                <div class="user-profile-badge">
                    <div class="user-avatar" th:text="${loggedInUserInitials}">MF</div>
                    <div class="user-name" th:text="${loggedInUserFullName}">Muhamad Fahrizal</div>
                </div>
                <form th:action="@{/logout}" method="POST" style="display: inline;">
                    <button type="submit" class="btn btn-secondary btn-sm" style="padding: 0.5rem 0.75rem; border-color: rgba(239, 68, 68, 0.3); color: #fca5a5; background: transparent; cursor: pointer; display: flex; align-items: center; gap: 0.35rem;" title="Keluar">
                        <i data-lucide="log-out" style="width: 15px; height: 15px;"></i>
                        <span>Keluar</span>
                    </button>
                </form>
            </div>
        </header>

        <!-- Form Card -->
        <div class="card">
            <h2 class="card-title">Edit Tugas</h2>
            
            <form th:action="@{/tasks/{id}(id=${task.id})}" th:object="${task}" method="POST">
                <!-- Hidden ID field -->
                <input type="hidden" th:field="*{id}">
                
                <!-- Title -->
                <div class="form-group">
                    <label for="title" class="form-label">Judul Tugas</label>
                    <input type="text" id="title" th:field="*{title}" class="form-control" required>
                </div>
                
                <!-- Course & Due Date Grid -->
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <!-- Course -->
                    <div class="form-group">
                        <label for="course" class="form-label">Mata Kuliah</label>
                        <input type="text" id="course" th:field="*{course}" class="form-control" required>
                    </div>
                    
                    <!-- Due Date -->
                    <div class="form-group">
                        <label for="dueDate" class="form-label">Tenggat Waktu</label>
                        <input type="date" id="dueDate" th:field="*{dueDate}" class="form-control" required>
                    </div>
                </div>
                
                <!-- Status & Priority Grid -->
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <!-- Status -->
                    <div class="form-group">
                        <label for="status" class="form-label">Status Tugas</label>
                        <select id="status" th:field="*{status}" class="form-control" required>
                            <option value="Belum Mulai" th:selected="${task.status == 'Belum Mulai'}">Belum Mulai</option>
                            <option value="Sedang Dikerjakan" th:selected="${task.status == 'Sedang Dikerjakan'}">Sedang Dikerjakan</option>
                            <option value="Selesai" th:selected="${task.status == 'Selesai'}">Selesai</option>
                        </select>
                    </div>
                    
                    <!-- Priority -->
                    <div class="form-group">
                        <label for="priority" class="form-label">Prioritas</label>
                        <select id="priority" th:field="*{priority}" class="form-control" required>
                            <option value="Tinggi" th:selected="${task.priority == 'Tinggi'}">Tinggi</option>
                            <option value="Sedang" th:selected="${task.priority == 'Sedang'}">Sedang</option>
                            <option value="Rendah" th:selected="${task.priority == 'Rendah'}">Rendah</option>
                        </select>
                    </div>
                </div>
                
                <!-- Description -->
                <div class="form-group">
                    <label for="description" class="form-label">Deskripsi Tugas</label>
                    <textarea id="description" th:field="*{description}" class="form-control" placeholder="Tuliskan deskripsi lengkap instruksi tugas di sini..."></textarea>
                </div>
                
                <!-- Form Actions -->
                <div class="form-actions">
                    <a th:href="@{/tasks}" class="btn btn-secondary">Batal</a>
                    <button type="submit" class="btn btn-primary">
                        <i data-lucide="check"></i>
                        <span>Simpan Perubahan</span>
                    </button>
                </div>
            </form>
        </div>

        <!-- Footer -->
        <footer>
            <p>&copy; 2026 Muhamad Fahrizal - Pemrograman 2. Koneksi Database &amp; Port Berjalan Lancar.</p>
        </footer>
    </div>

    <!-- Lucide Icons Library -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
